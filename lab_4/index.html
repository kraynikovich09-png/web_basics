<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Моя перша HTML-форма</title>
  </head>
  <body>
    <h1>Моя перша HTML-форма</h1>

    <form action="https://httpbin.org/post" method="POST">
      <p>
        <label for="name">Ім'я:</label>
        <input type="text" id="name" name="user_name" />
      </p>

      <p>
        <label for="birthdate">Дата народження:</label>
        <input type="date" id="birthdate" name="user_birthdate" />
      </p>

      <p>
        <label>
          Імейл:
          <input type="email" name="user_email" />
        </label>
      </p>

      <p>
        <label>
          Повідомлення:
          <textarea name="user_message" rows="3" cols="25"></textarea>
        </label>
      </p>

      <p>Ваші улюблені напої?</p>
      <p>
        <label
          ><input type="checkbox" name="drinks" value="coffee" /> Кава</label
        ><br />
        <label><input type="checkbox" name="drinks" value="tea" /> Чай</label
        ><br />
        <label><input type="checkbox" name="drinks" value="juice" /> Сік</label
        ><br />
        <label
          ><input type="checkbox" name="drinks" value="water" /> Вода</label
        >
      </p>

      <p>Моя національність:</p>
      <p>
        <label
          ><input type="radio" name="nationality" value="ukrainian" /> Українець
          / Українка</label
        ><br />
        <label
          ><input type="radio" name="nationality" value="polish" /> Поляк /
          Полька</label
        ><br />
        <label
          ><input type="radio" name="nationality" value="other" /> Інша</label
        >
      </p>

      <p>
        <button type="submit">Надіслати</button>
        <button type="reset">Очистити</button>
      </p>
    </form>
    <picture>
      <source media="(max-width: 467px)" srcset="https://picsum.photos" />
      <img
        src="https://fastly.picsum.photos/id/441/200/300.jpg?hmac=QKMN_HV9XLlzyUWdanPyq2Qz8FJmYYH5Q0CjPACcnsI"
        alt="Демонстраційне зображення"
      />
    </picture>
  </body>
</html>
